name: Publish custom release

# Live release path. This workflow is deliberately manual-only while the
# remaining migration workflows stay dry-run-only. It clones the merged stable
# private ref, stages a draft release, uploads platform assets directly, then
# verifies and publishes the exact eight-asset release.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private stable ref; live releases accept master only
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: public-live-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan live release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      upstream_commit: ${{ steps.plan.outputs.upstream_commit }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout public workflow repository
        uses: actions/checkout@v4

      - name: Clone merged private stable ref
        id: source
        shell: pwsh
        env:
          PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          MANAGER_DIR: ${{ runner.temp }}/private-manager
        run: |
          if ($env:SOURCE_REF -ne 'master') { throw 'Live releases accept only the merged master ref.' }
          pwsh -NoProfile -File ./scripts/secure-clone.ps1 `
            -Owner $env:PRIVATE_REPO_OWNER `
            -Name $env:PRIVATE_REPO_NAME `
            -Token $env:PRIVATE_REPO_READ_TOKEN `
            -Destination $env:MANAGER_DIR `
            -Branch $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone the merged private stable ref.' }
          "MANAGER_DIR=$env:MANAGER_DIR" >> $env:GITHUB_ENV
          $sourceSha = (& git -C $env:MANAGER_DIR rev-parse HEAD 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sourceSha) { throw 'Could not identify the merged private source.' }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Plan next custom stable version and guard the tag
        id: plan
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          GH_TOKEN: ${{ github.token }}
        run: |
          $lockPath = Join-Path $env:MANAGER_DIR 'upstream.lock.json'
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          if ($lock.channel -ne 'stable') { throw 'The merged private lock is not on the stable channel.' }

          Push-Location -LiteralPath $env:MANAGER_DIR
          try {
            $identityLog = Join-Path $env:RUNNER_TEMP 'identity.log'
            & pwsh -NoProfile -File ./scripts/get-build-identity.ps1 *> $identityLog
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'LIVE RELEASE ERROR CATEGORY: build-identity'
              throw 'Build identity planning failed; details are suppressed.'
            }
            $identity = Get-Content -LiteralPath $identityLog -Raw | ConvertFrom-Json

            $releaseLog = Join-Path $env:RUNNER_TEMP 'release-version.log'
            & pwsh -NoProfile -File ./scripts/get-release-version.ps1 `
              -Repository $env:GITHUB_REPOSITORY `
              -Fingerprint $identity.fingerprint *> $releaseLog
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'LIVE RELEASE ERROR CATEGORY: release-version'
              throw 'Release version planning failed; details are suppressed.'
            }
            $release = Get-Content -LiteralPath $releaseLog -Raw | ConvertFrom-Json
          }
          finally {
            Pop-Location
          }

          if ($release.publishedTag) {
            Write-Host 'LIVE RELEASE ERROR CATEGORY: tag-exists'
            throw 'This build fingerprint is already published.'
          }

          $tagResult = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$($release.tag)" 2>&1)
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) {
            Write-Host 'LIVE RELEASE ERROR CATEGORY: tag-exists'
            throw 'The release tag already exists.'
          }
          if (($tagResult -join "`n") -notmatch '(?i)404|not found') {
            Write-Host 'LIVE RELEASE ERROR CATEGORY: tag-check'
            throw 'The release tag guard could not determine whether the tag exists.'
          }

          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag)" >> $env:GITHUB_OUTPUT
          "fingerprint=$($identity.fingerprint)" >> $env:GITHUB_OUTPUT
          "upstream_tag=$($lock.stableTag)" >> $env:GITHUB_OUTPUT
          "upstream_commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
          Write-Host "Planned live release $($release.tag) from stable $($lock.stableTag)."
          $LASTEXITCODE = 0
          exit 0

  stage:
    name: Create draft release
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
      UPSTREAM_COMMIT: ${{ needs.plan.outputs.upstream_commit }}
      FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
    steps:
      - name: Create draft release
        shell: pwsh
        run: |
          $notes = @(
            "Custom Windows x64 and Linux x64 build of T3 Code $env:UPSTREAM_TAG (upstream commit $env:UPSTREAM_COMMIT) with local patches."
            ''
            'Includes self-contained Windows/Linux CLI archives and SHA256SUMS.'
            ''
            'Unsigned: Windows SmartScreen may warn on a fresh install.'
            ''
            "build-fingerprint: $env:FINGERPRINT"
          ) -join "`n"
          gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --title "T3 Code $env:VERSION" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          exit 0

  build:
    name: Build and upload ${{ matrix.platform }} assets
    needs: [plan, stage]
    if: needs.stage.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout public workflow repository
        uses: actions/checkout@v4

      - name: Clone merged private stable ref
        shell: pwsh
        env:
          PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          SOURCE_DIR: ${{ runner.temp }}/upstream-source
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          pwsh -NoProfile -File ./scripts/secure-clone.ps1 `
            -Owner $env:PRIVATE_REPO_OWNER `
            -Name $env:PRIVATE_REPO_NAME `
            -Token $env:PRIVATE_REPO_READ_TOKEN `
            -Destination $env:MANAGER_DIR `
            -Revision $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone the merged private stable ref.' }
          "MANAGER_DIR=$env:MANAGER_DIR" >> $env:GITHUB_ENV
          "SOURCE_DIR=$env:SOURCE_DIR" >> $env:GITHUB_ENV
          exit 0

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Set up Rust for Linux native helpers
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Apply patch series with suppressed output
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          SOURCE_DIR: ${{ runner.temp }}/upstream-source
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'apply-patches.log'
          & pwsh -NoProfile -File (Join-Path $env:MANAGER_DIR 'scripts/apply-patches.ps1') -SourceDir $env:SOURCE_DIR *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'LIVE RELEASE ERROR CATEGORY: apply-patches'
            throw 'Patch application failed; details are suppressed.'
          }
          exit 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: ${{ runner.temp }}/upstream-source
          node-version-file: ${{ runner.temp }}/upstream-source/package.json
          cache: false
          run-install: false

      - name: Build and collect release assets
        id: assets
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          SOURCE_DIR: ${{ runner.temp }}/upstream-source
          VERSION: ${{ needs.plan.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pwsh -NoProfile -File ./scripts/live-build-platform.ps1 `
            -ManagerDir $env:MANAGER_DIR `
            -SourceDir $env:SOURCE_DIR `
            -Platform '${{ matrix.platform }}' `
            -Version $env:VERSION `
            -Repository $env:REPOSITORY `
            -SkipApply
          if ($LASTEXITCODE -ne 0) { throw 'Live platform build failed; details are suppressed.' }
          exit 0

      - name: Upload assets to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:ASSET_DIR -File | ForEach-Object FullName)
          if ($files.Count -eq 0) { throw 'No platform assets were collected.' }
          & gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          exit 0

  finalize:
    name: Verify and publish release
    needs: [plan, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
      PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
    steps:
      - name: Checkout public workflow repository
        uses: actions/checkout@v4

      - name: Download draft release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the staged release assets.' }
          exit 0

      - name: Check exact asset set and generate SHA256SUMS
        shell: pwsh
        run: |
          $expected = @(
            "T3-Code-$env:VERSION-x64.exe"
            "T3-Code-$env:VERSION-x64.exe.blockmap"
            'T3-Code-x86_64.AppImage'
            'latest.yml'
            'latest-linux.yml'
            "t3-$env:VERSION-win32-x64.zip"
            "t3-$env:VERSION-linux-x64.tar.gz"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object Name | Sort-Object)
          $missing = @($expected | Where-Object { $_ -notin $actual })
          $extra = @($actual | Where-Object { $_ -notin $expected })
          if ($missing.Count -or $extra.Count) {
            Write-Host 'LIVE RELEASE ERROR CATEGORY: release-asset-set'
            throw 'The staged release does not contain exactly the expected seven pre-checksum assets.'
          }
          $lines = foreach ($file in Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-assets/SHA256SUMS'), (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          exit 0

      - name: Clone private validation scripts
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
        run: |
          pwsh -NoProfile -File ./scripts/secure-clone.ps1 `
            -Owner $env:PRIVATE_REPO_OWNER `
            -Name $env:PRIVATE_REPO_NAME `
            -Token $env:PRIVATE_REPO_READ_TOKEN `
            -Destination $env:MANAGER_DIR `
            -Branch master
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone private validation scripts.' }
          exit 0

      - name: Verify release assets and checksums
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release-asset-validation.log'
          & pwsh -NoProfile -File (Join-Path $env:MANAGER_DIR 'tests/auto-update/Test-ReleaseAssets.ps1') `
            -Platform all `
            -AssetDir (Join-Path (Get-Location) 'release-assets') `
            -Version $env:VERSION `
            -Repository $env:GITHUB_REPOSITORY `
            -RequireChecksums *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'LIVE RELEASE ERROR CATEGORY: asset-validation'
            throw 'Release asset validation failed; details are suppressed.'
          }
          exit 0

      - name: Publish draft as latest release
        shell: pwsh
        run: |
          $releaseJson = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'The staged release lookup failed.' }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.id) { throw 'The staged release could not be found.' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" `
            -F draft=false -F prerelease=false -f make_latest=true *> (Join-Path $env:RUNNER_TEMP 'publish-release.log')
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the draft release failed.' }
          exit 0

      - name: Verify published release anonymously
        shell: pwsh
        run: |
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          $expected = @(
            "T3-Code-$env:VERSION-x64.exe"
            "T3-Code-$env:VERSION-x64.exe.blockmap"
            'T3-Code-x86_64.AppImage'
            'latest.yml'
            'latest-linux.yml'
            "t3-$env:VERSION-win32-x64.zip"
            "t3-$env:VERSION-linux-x64.tar.gz"
            'SHA256SUMS'
          )
          for ($attempt = 1; ; $attempt++) {
            try {
              $latest = Invoke-RestMethod -Uri "$base/latest" -Headers @{ Accept = 'application/json' }
              if ($latest.tag_name -ne $env:TAG -or $latest.draft -or $latest.prerelease) { throw 'The published latest release is not the expected stable tag.' }
              foreach ($name in @('latest.yml', 'latest-linux.yml', 'SHA256SUMS')) {
                $remote = (Invoke-WebRequest -Uri "$base/download/$env:TAG/$name").Content
                $local = Get-Content -LiteralPath (Join-Path 'release-assets' $name) -Raw
                if ($remote -ne $local) { throw "Published $name differs from the verified bytes." }
              }
              foreach ($name in $expected) {
                $null = Invoke-WebRequest -Uri "$base/download/$env:TAG/$name" -Headers @{ Range = 'bytes=0-0' }
              }
              Write-Host "Published $env:TAG as the latest stable release with all eight assets."
              break
            }
            catch {
              if ($attempt -ge 6) { throw 'Anonymous release verification failed.' }
              Start-Sleep -Seconds 10
            }
          }
          exit 0

  cleanup:
    name: Remove failed draft release
    needs: [plan, stage, build, finalize]
    if: always() && needs.stage.result == 'success' && needs.finalize.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Delete failed draft and tag
        shell: bash
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft' 2>/dev/null || true)
          if [ "$draft" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi
