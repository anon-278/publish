name: Validate private pull requests

# The public repository cannot receive private-repository PR events.
# Polling and repository_dispatch keep the trigger surface explicit while the
# commit statuses below give auto-merge an exact head-SHA gate.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Private pull request number, or all open pull requests
        required: false
        default: all
        type: string
      full_build:
        description: Run the Windows and Linux package builds
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [validate]

permissions:
  contents: read

concurrency:
  group: public-validate
  cancel-in-progress: true

jobs:
  select:
    name: Select private pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      has_targets: ${{ steps.select.outputs.has_targets }}
    steps:
      - name: Checkout public workflow repository
        uses: actions/checkout@v4

      - name: Poll open private pull requests
        id: select
        shell: pwsh
        env:
          PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          PRIVATE_REPO_MERGE_TOKEN: ${{ secrets.PRIVATE_REPO_MERGE_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number || 'all' }}
          FULL_BUILD_INPUT: ${{ inputs.full_build }}
          DISPATCH_FULL_BUILD: ${{ github.event.client_payload.full_build }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $repo = "$env:PRIVATE_REPO_OWNER/$env:PRIVATE_REPO_NAME"
          Write-Output "::add-mask::$repo"
          Write-Output "::add-mask::https://github.com/$repo"
          function Get-PrivateApi([string] $Owner, [string] $Name, [string] $Token, [string] $Path) {
            $requestRepo = "$Owner/$Name"
            $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $Token"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            try {
              return Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$requestRepo/$Path" -Headers $headers -ErrorAction Stop
            }
            catch {
              $statusCode = 'unknown'
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              Write-Host "LIVE VALIDATE ERROR CATEGORY: private-api-http-$statusCode"
              throw "Private pull request polling failed (HTTP $statusCode); details are suppressed."
            }
          }

          $requested = if ([string]::IsNullOrWhiteSpace($env:PR_NUMBER)) { 'all' } else { $env:PR_NUMBER.Trim() }
          if ($requested -eq 'all' -or -not $requested) {
            $pulls = @(Get-PrivateApi $env:PRIVATE_REPO_OWNER $env:PRIVATE_REPO_NAME $env:PRIVATE_REPO_READ_TOKEN 'pulls?state=open&base=master&per_page=100')
          }
          else {
            if ($requested -notmatch '^\d+$' -or [int]$requested -lt 1) { throw 'The requested pull request number is invalid.' }
            $pulls = @(Get-PrivateApi $env:PRIVATE_REPO_OWNER $env:PRIVATE_REPO_NAME $env:PRIVATE_REPO_READ_TOKEN "pulls/$requested")
          }

          $selected = @(
            $pulls | Where-Object {
              $_.state -eq 'open' -and
              $_.base.ref -eq 'master' -and
              $_.head.repo.full_name -eq $repo
            }
          )
          if ($requested -ne 'all' -and $selected.Count -eq 0) {
            throw 'The requested pull request is not an eligible open same-repository PR.'
          }

          $rawFullBuild = if ($env:EVENT_NAME -eq 'schedule') { 'true' } elseif ($env:FULL_BUILD_INPUT) { $env:FULL_BUILD_INPUT } elseif ($env:DISPATCH_FULL_BUILD) { $env:DISPATCH_FULL_BUILD } else { 'true' }
          $allowFullBuild = $rawFullBuild -match '^(?i:true|1|yes)$'
          $targets = foreach ($pr in $selected) {
            $alreadyValidated = $false
            if ($allowFullBuild) {
              $status = Get-PrivateApi $env:PRIVATE_REPO_OWNER $env:PRIVATE_REPO_NAME $env:PRIVATE_REPO_MERGE_TOKEN "commits/$($pr.head.sha)/status"
              $alreadyValidated = $true
              foreach ($context in @('custom-validate/windows', 'custom-validate/linux')) {
                $latest = @(
                  $status.statuses |
                    Where-Object { $_.context -eq $context } |
                    Sort-Object { [DateTimeOffset]$_.updated_at } -Descending |
                    Select-Object -First 1
                )
                if ($latest.Count -eq 0 -or $latest[0].state -ne 'success') {
                  $alreadyValidated = $false
                  break
                }
              }
            }
            if ($allowFullBuild -and $alreadyValidated) { continue }
            $runFullBuild = $allowFullBuild
            $platforms = if ($runFullBuild) { @('windows', 'linux') } else { @('windows') }
            foreach ($platform in $platforms) {
              [ordered]@{
                number = [int]$pr.number
                head_sha = [string]$pr.head.sha
                platform = $platform
                full_build = $runFullBuild
              }
            }
          }
          $targets = @($targets)
          $hasTargets = $targets.Count -gt 0
          if (-not $hasTargets) {
            # Keep the matrix syntactically valid; the job-level gate skips it.
            $targets = @([ordered]@{ number = 0; head_sha = ''; platform = 'none' })
          }
          "targets=$(@($targets) | ConvertTo-Json -Compress -Depth 4)" >> $env:GITHUB_OUTPUT
          "has_targets=$($hasTargets.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Selected $($selected.Count) eligible private pull request(s); unvalidated full builds are enabled=$allowFullBuild."

  validate:
    name: "Validate PR #${{ matrix.number }} (${{ matrix.platform }})"
    needs: select
    if: needs.select.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || 'windows-latest' }}
    timeout-minutes: 50
    steps:
      - name: Checkout public workflow repository
        uses: actions/checkout@v4

      - name: Report validation pending
        shell: pwsh
        env:
          PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_REPO_MERGE_TOKEN: ${{ secrets.PRIVATE_REPO_MERGE_TOKEN }}
          HEAD_SHA: ${{ matrix.head_sha }}
          PLATFORM: ${{ matrix.platform }}
          FULL_BUILD: ${{ matrix.full_build }}
        run: |
          $repo = "$env:PRIVATE_REPO_OWNER/$env:PRIVATE_REPO_NAME"
          Write-Output "::add-mask::$repo"
          $context = if ($env:FULL_BUILD -eq 'true') { "custom-validate/$env:PLATFORM" } else { "custom-preflight/$env:PLATFORM" }
          $body = [ordered]@{
            state = 'pending'
            target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            description = 'Validation started.'
            context = $context
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/$repo/statuses/$env:HEAD_SHA" `
              -Headers @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:PRIVATE_REPO_MERGE_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' } `
              -ContentType 'application/json' -Body $body -ErrorAction Stop | Out-Null
          }
          catch {
            Write-Host 'LIVE VALIDATE ERROR CATEGORY: status-pending'
            throw 'Could not report validation status; details are suppressed.'
          }

      - name: Clone exact private pull request head
        shell: pwsh
        env:
          PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          PR_NUMBER: ${{ matrix.number }}
          HEAD_SHA: ${{ matrix.head_sha }}
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          SOURCE_DIR: ${{ runner.temp }}/upstream-source
        run: |
          pwsh -NoProfile -File ./scripts/secure-clone.ps1 `
            -Owner $env:PRIVATE_REPO_OWNER `
            -Name $env:PRIVATE_REPO_NAME `
            -Token $env:PRIVATE_REPO_READ_TOKEN `
            -Destination $env:MANAGER_DIR `
            -PullNumber ([int]$env:PR_NUMBER) `
            -Revision $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone the private pull request.' }
          "MANAGER_DIR=$env:MANAGER_DIR" >> $env:GITHUB_ENV
          "SOURCE_DIR=$env:SOURCE_DIR" >> $env:GITHUB_ENV

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Set up Rust for Linux native helpers
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Plan release version
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          RELEASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_REPO -notmatch '^[^/\s]+/[^/\s]+$') { throw 'The public release repository is not configured.' }
          $identityLog = Join-Path $env:RUNNER_TEMP 'identity.log'
          Push-Location -LiteralPath $env:MANAGER_DIR
          try {
            & pwsh -NoProfile -File ./scripts/get-build-identity.ps1 *> $identityLog
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'LIVE VALIDATE ERROR CATEGORY: build-identity'
              throw 'Build identity planning failed; details are suppressed.'
            }
            $identity = Get-Content -LiteralPath $identityLog -Raw | ConvertFrom-Json
            $releaseLog = Join-Path $env:RUNNER_TEMP 'release-version.log'
            & pwsh -NoProfile -File ./scripts/get-release-version.ps1 `
              -Repository $env:RELEASE_REPO `
              -Fingerprint $identity.fingerprint *> $releaseLog
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'LIVE VALIDATE ERROR CATEGORY: release-version'
              throw 'Release version planning failed; details are suppressed.'
            }
            $release = Get-Content -LiteralPath $releaseLog -Raw | ConvertFrom-Json
            "VERSION=$($release.version)" >> $env:GITHUB_ENV
          }
          finally {
            Pop-Location
          }

      - name: Apply patch series with suppressed output
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          SOURCE_DIR: ${{ runner.temp }}/upstream-source
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'apply-patches.log'
          try {
            & pwsh -NoProfile -File (Join-Path $env:MANAGER_DIR 'scripts/apply-patches.ps1') -SourceDir $env:SOURCE_DIR *> $log
            if ($LASTEXITCODE -ne 0) { throw 'apply-patches failed' }
          }
          catch {
            Write-Host 'LIVE VALIDATE ERROR CATEGORY: apply'
            throw 'Patch application failed; details are suppressed.'
          }

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: ${{ runner.temp }}/upstream-source
          node-version-file: ${{ runner.temp }}/upstream-source/package.json
          cache: false
          run-install: false

      - name: Run privacy-safe validation and package
        shell: pwsh
        env:
          MANAGER_DIR: ${{ runner.temp }}/private-manager
          SOURCE_DIR: ${{ runner.temp }}/upstream-source
          PLATFORM: ${{ matrix.platform }}
          FULL_BUILD: ${{ matrix.full_build }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERSION)) {
            Write-Host 'LIVE VALIDATE ERROR CATEGORY: version-env'
            throw 'Release version was not provided to the build step; details are suppressed.'
          }
          $buildArgs = @(
            '-NoProfile', '-File', './scripts/dry-run-build.ps1',
            '-ManagerDir', $env:MANAGER_DIR,
            '-SourceDir', $env:SOURCE_DIR,
            '-Platform', $env:PLATFORM,
            '-Version', $env:VERSION,
            '-Repository', $env:RELEASE_REPO
          )
          if ($env:FULL_BUILD -eq 'true') { $buildArgs += '-FullBuild' }
          $buildArgs += '-SkipApply'
          & pwsh @buildArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "LIVE VALIDATE ERROR CATEGORY: build-$env:PLATFORM"
            throw 'Validation or packaging failed; details are suppressed.'
          }

      - name: Report validation result
        if: always()
        shell: pwsh
        env:
          PRIVATE_REPO_OWNER: ${{ secrets.PRIVATE_REPO_OWNER }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          PRIVATE_REPO_MERGE_TOKEN: ${{ secrets.PRIVATE_REPO_MERGE_TOKEN }}
          HEAD_SHA: ${{ matrix.head_sha }}
          PLATFORM: ${{ matrix.platform }}
          FULL_BUILD: ${{ matrix.full_build }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $repo = "$env:PRIVATE_REPO_OWNER/$env:PRIVATE_REPO_NAME"
          Write-Output "::add-mask::$repo"
          $context = if ($env:FULL_BUILD -eq 'true') { "custom-validate/$env:PLATFORM" } else { "custom-preflight/$env:PLATFORM" }
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'Validation and packaging passed.' } else { 'Validation or packaging failed.' }
          $body = [ordered]@{
            state = $state
            target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            description = $description
            context = $context
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/$repo/statuses/$env:HEAD_SHA" `
              -Headers @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:PRIVATE_REPO_MERGE_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' } `
              -ContentType 'application/json' -Body $body -ErrorAction Stop | Out-Null
          }
          catch {
            Write-Host 'LIVE VALIDATE ERROR CATEGORY: status-result'
            throw 'Could not report final validation status; details are suppressed.'
          }
          exit 0
